name: Nightly Monte Carlo Tournament Simulation

on:
  schedule:
    # Run at 5 AM UTC every day (after nightly data refresh at 3 AM)
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-simulation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute tournament window
        id: window
        shell: bash
        run: |
          today=$(date -u +%F)
          # Run simulations during World Cup 2026 (June 11 - July 19, 2026)
          if [[ "$today" > "2026-06-10" && "$today" < "2026-07-20" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Monte Carlo simulation
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python scripts/run_monte_carlo.py

      - name: Commit simulation results
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_files/tournament_simulation.json
          if git diff --cached --quiet; then
            echo "No simulation results changes to commit."
            exit 0
          fi
          git commit -m "chore: nightly Monte Carlo simulation update [skip ci]"
          git push
