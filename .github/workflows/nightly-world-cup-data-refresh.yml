name: Nightly World Cup data refresh

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute tournament window
        id: window
        shell: bash
        run: |
          today=$(date -u +%F)
          if [[ "$today" > "2026-06-03" && "$today" < "2026-07-27" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull nightly snapshot
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          THE_SPORTS_DB_KEY: ${{ secrets.THE_SPORTS_DB_KEY }}
        run: |
          python scripts/pull_world_cup_data.py

      - name: Commit snapshot changes
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data_files/nightly_snapshots
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git commit -m "chore: nightly World Cup data refresh [skip ci]"
          git push
